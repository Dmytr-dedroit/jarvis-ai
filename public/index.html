function cnt(k){var n=0;L[k].l.forEach(function(_,i){if(S.done[k+i])n++});return n}
function total(){var n=0;Object.keys(L).forEach(function(k){n+=cnt(k)});return n}
var view='home',main=document.getElementById('v');
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(function(){el.style.display='none'},5000)}
function home(){
  var all=Object.keys(L).length*4,done=total(),p=Math.round(done/all*100),C=2*Math.PI*90;
  var dt=new Date().toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});
  var t=Object.keys(L).map(function(k){var c=cnt(k);return '<button class="tile" data-sub="'+k+'"><b>'+L[k].n+'</b><small>'+c+' з 4 уроків</small><div class="mb"><i style="width:'+c*25+'%"></i></div></button>'}).join('');
  return '<p class="date">'+dt+'</p><h1 class="serif">Привіт! Що вчимо сьогодні?</h1>'+
  '<div class="card hero"><div class="ring"><svg viewBox="0 0 208 208"><defs><linearGradient id="rg"><stop offset="0" stop-color="var(--g1)"/><stop offset="1" stop-color="var(--g2)"/></linearGradient></defs><circle class="bg" cx="104" cy="104" r="90"/><circle class="fg" cx="104" cy="104" r="90" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-p/100)+'"/></svg><b><span class="score serif">'+p+'%</span><small>усього пройдено</small></b></div>'+
  '<span class="pill">Серія: '+streak()+' дн. · Бали: '+done*10+'</span></div><div class="tiles">'+t+'</div>';
}
function learn(){
  var k=S.sub,chips=Object.keys(L).map(function(x){return '<button class="chip" data-sub="'+x+'" aria-pressed="'+(x===k)+'">'+L[x].n+'</button>'}).join('');
  var ls=L[k].l.map(function(a,i){var on=S.done[k+i];return '<button class="les'+(on?' on':'')+'" data-les="'+i+'" aria-pressed="'+!!on+'"><span class="ck">✓</span><span><b>'+a[0]+'</b><small>'+a[1]+'</small></span></button>'}).join('');
  return '<h1 class="serif">Навчання</h1><div class="chips">'+chips+'</div>'+daily(k)+'<div class="card">'+ls+'</div>';
}
function remind(){
  var perm=window.Notification&&Notification.permission!=='granted'&&Notification.permission!=='denied';
  var list=S.rem.slice().sort(function(a,b){return a.at<b.at?-1:1}).map(function(r){return '<div class="rem'+(r.fired?' fired':'')+'"><span><b>'+e(r.t)+'</b><br><small>'+new Date(r.at).toLocaleString('uk-UA',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+'</small></span><button class="btn soft" data-del="'+r.id+'" aria-label="Видалити нагадування">Видалити</button></div>'}).join('');
  return '<h1 class="serif">Нагадування</h1><div class="card"><input class="field" id="rt" placeholder="Про що нагадати?" aria-label="Текст нагадування"><input class="field" id="ra" type="datetime-local" aria-label="Коли нагадати"><button class="btn" data-add>Додати нагадування</button>'+(perm?' <button class="btn soft" data-perm>Дозволити сповіщення</button>':'')+'</div><div class="card">'+(list||'<p class="empty">Нагадувань ще немає. Додайте перше вище.</p>')+'</div><p class="empty">Сповіщення спрацьовують, поки сторінка відкрита.</p>';
}
function ai(){
  var m=S.chat.map(function(c){return '<div class="msg'+(c.me?' me':'')+'">'+e(c.t)+'</div>'}).join('');
  return '<h1 class="serif">AI-помічник</h1><div class="card">'+(m||'<p class="empty">Привіт! Я JARVIS. Поставте своє запитання — відповім за допомогою AI.</p>')+'</div><div class="card"><input class="field" id="q" placeholder="Ваше запитання" aria-label="Запитання до AI"><button class="btn" data-send>Надіслати</button></div>';
}
function render(){
  view=(location.hash||'#home').slice(1);if(!{home:1,learn:1,remind:1,ai:1}[view])view='home';
  main.innerHTML={home:home,learn:learn,remind:remind,ai:ai}[view]();
  [].forEach.call(document.querySelectorAll('nav a'),function(a){if(a.getAttribute('href')==='#'+view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
main.addEventListener('click',async function(ev){
  var t=ev.target.closest('[data-sub],[data-les],[data-add],[data-del],[data-perm],[data-send],[data-ans],[data-q2]');if(!t)return;
  if(t.dataset.sub){S.sub=t.dataset.sub;save();if(view==='home')location.hash='#learn';else render()}
  else if(t.dataset.les!==undefined){var id=S.sub+t.dataset.les;if(S.done[id])delete S.done[id];else{S.done[id]=1;var d=day();if(S.days.indexOf(d)<0)S.days.push(d)}save();render()}
  else if('add' in t.dataset){var tx=document.getElementById('rt').value.trim(),at=document.getElementById('ra').value;if(!tx||!at){toast('Введіть текст і час нагадування');return}S.rem.push({id:Date.now(),t:tx,at:at,fired:false});save();render()}
  else if(t.dataset.del){S.rem=S.rem.filter(function(r){return String(r.id)!==t.dataset.del});save();render()}
  else if('perm' in t.dataset){try{Notification.requestPermission().then(render)}catch(x){}}
  else if(t.dataset.q2){var p2=t.dataset.q2.split(':'),k2=p2[0],d2=day(),st=S.q2[k2];if(!st||st.d!==d2)st=S.q2[k2]={d:d2,a:{}};st.a[p2[1]]=+p2[2];if(S.days.indexOf(d2)<0)S.days.push(d2);save();render()}
  else if(t.dataset.ans){var p=t.dataset.ans.split(':'),d=day();if(S.qz.d!==d)S.qz={d:d,a:{}};S.qz.a[p[0]]=+p[1];if(qs().every(function(qi){return S.qz.a[qi]!==undefined})&&S.days.indexOf(d)<0)S.days.push(d);save();render()}
  else if('send' in t.dataset){
    var input=document.getElementById('q'),q=input.value.trim();if(!q)return;
    if(q.length>5000){toast('Повідомлення задовге (максимум 5000 символів)');return}
    var history=S.chat.slice(-12).map(function(c){return {role:c.me?'user':'assistant',content:c.t}});
    S.chat.push({me:1,t:q},{t:'JARVIS думає…'});save();render();
    var sendButton=main.querySelector('[data-send]');if(sendButton)sendButton.disabled=true;
    try{
      var response=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:history})});
      var data=await response.json();
      if(!response.ok)throw new Error(data.error||'Помилка сервера');
      S.chat[S.chat.length-1]={t:data.reply||'Не вдалося отримати відповідь.'};
    }catch(err){S.chat[S.chat.length-1]={t:'Не вдалося зв’язатися з AI: '+(err.message||'невідома помилка')+'. Перевірте серверні налаштування Netlify.'}}
    save();render();
  }
});
function tick(){var now=Date.now(),hit=false;S.rem.forEach(function(r){if(!r.fired&&new Date(r.at).getTime()<=now){r.fired=true;hit=true;toast('Нагадування: '+r.t);try{if(window.Notification&&Notification.permission==='granted')new Notification('Джарвіс',{body:r.t})}catch(x){}}});if(hit){save();if(view==='remind')render()}}
window.addEventListener('hashchange',render);render();setInterval(tick,20000);tick();
</script>
</body>
</html>
